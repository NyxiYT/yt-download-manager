name: Release

# A version tag (v1.6.0) checks the versions, then runs compat.yml: it builds both installers, the extension zip
# and the userscript, and installs and runs them on every supported version of Windows, Linux distribution and
# browser. Only when every one of those runs passes are the same files published. Then packages.yml updates
# Scoop and winget. Installed apps notice the new release on their own.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check versions
        id: check
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($p in 'manager/YTDownloadManager/YTDownloadManager.csproj', 'manager/Setup/Setup.csproj') {
            $have = ([xml](Get-Content $p)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if ($have -ne $v) { throw "$p has version $have, the tag says $v" }
          }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$v]" -Quiet)) { throw "CHANGELOG.md has no entry for $v" }
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

  compat:
    needs: versions
    uses: ./.github/workflows/compat.yml

  publish:
    needs: [versions, compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.versions.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The files the compatibility runs tested.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Checksums
        shell: pwsh
        run: |
          $files = 'YTDownloadManager-Setup-x64.exe', 'YTDownloadManager-Setup-x86.exe', 'YTStandaloneDownloader-Extension.zip', 'yt-standalone-downloader.user.js'
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 "dist/$f").Hash.ToLower(), $f }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      # Apps from 1.12 on install an update only when SHA256SUMS.txt is signed with a key built into them
      # (manager/YTDownloadManager/update-keys.pem). No release goes out that they would refuse.
      - name: Sign the checksums
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          keys=manager/YTDownloadManager/update-keys.pem
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::the UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          [ -s "$keys" ] || { echo "::error::$keys is missing"; exit 1; }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/update.key" "$RUNNER_TEMP/sig.bin" "$RUNNER_TEMP"/key-*' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.key"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update.key" -rawin -in dist/SHA256SUMS.txt -out "$RUNNER_TEMP/sig.bin"
          printf '%s\n' "$(base64 -w0 "$RUNNER_TEMP/sig.bin")" > dist/SHA256SUMS.txt.sig
          # The same check the apps make: one of the built-in keys has to accept it.
          csplit -s -z -f "$RUNNER_TEMP/key-" "$keys" '/-----BEGIN PUBLIC KEY-----/' '{*}'
          ok=0
          for k in "$RUNNER_TEMP"/key-*; do
            openssl pkeyutl -verify -pubin -inkey "$k" -rawin -in dist/SHA256SUMS.txt -sigfile "$RUNNER_TEMP/sig.bin" >/dev/null 2>&1 && ok=1
          done
          [ "$ok" = 1 ] || { echo "::error::no key in $keys accepts the signature"; exit 1; }
          cat dist/SHA256SUMS.txt.sig

      - name: Release notes
        shell: pwsh
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[0-9])")
          $notes = $m.Groups[1].Value.Trim() + "`n`n" + (Get-Content .github/release-notes.md -Raw)
          [IO.File]::WriteAllText("$PWD/notes.md", $notes)
          Get-Content notes.md

      - name: Publish
        run: |
          gh release create '${{ github.ref_name }}' --verify-tag --title "YT Download Manager $VERSION" --notes-file notes.md \
            dist/YTDownloadManager-Setup-x64.exe dist/YTDownloadManager-Setup-x86.exe \
            dist/YTStandaloneDownloader-Extension.zip dist/yt-standalone-downloader.user.js dist/SHA256SUMS.txt \
            dist/SHA256SUMS.txt.sig

      # Scoop and winget: see packages.yml.
      - name: Update the package managers
        run: gh workflow run packages.yml --repo '${{ github.repository }}' --ref main -f "version=$VERSION"
