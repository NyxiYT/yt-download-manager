name: Release

# A version tag (v1.6.0) builds both installers, the extension zip and the userscript, installs each
# installer on the runner to check that it works, and only then publishes the release. Then it updates the
# package managers: the Scoop manifest in bucket/ (after a test install) and, with the WINGET_TOKEN secret,
# a pull request to winget. Installed apps notice the new release on their own.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check versions
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($p in 'manager/YTDownloadManager/YTDownloadManager.csproj', 'manager/Setup/Setup.csproj') {
            $have = ([xml](Get-Content $p)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if ($have -ne $v) { throw "$p has version $have, the tag says $v" }
          }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$v]" -Quiet)) { throw "CHANGELOG.md has no entry for $v" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check the extension
        shell: pwsh
        run: |
          python extension-build/convert.py
          git diff --exit-code -- extension/content
          if ($LASTEXITCODE) { throw 'extension/content is out of date: run python extension-build/convert.py' }
          foreach ($f in Get-ChildItem extension -Recurse -Filter *.js) { node --check $f.FullName; if ($LASTEXITCODE) { throw "$($f.Name) has a syntax error" } }

      - name: Build
        shell: cmd
        run: manager\build.cmd

      - name: Test the 64-bit installer
        shell: pwsh
        run: ./.github/smoke-test.ps1 -Setup dist/YTDownloadManager-Setup-x64.exe -Arch x64

      - name: Test the 32-bit installer
        shell: pwsh
        run: ./.github/smoke-test.ps1 -Setup dist/YTDownloadManager-Setup-x86.exe -Arch x86

      - name: Checksums
        shell: pwsh
        run: |
          $files = 'YTDownloadManager-Setup-x64.exe', 'YTDownloadManager-Setup-x86.exe', 'YTStandaloneDownloader-Extension.zip', 'yt-standalone-downloader.user.js'
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 "dist/$f").Hash.ToLower(), $f }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[0-9])")
          $notes = $m.Groups[1].Value.Trim() + "`n`n" + (Get-Content .github/release-notes.md -Raw)
          [IO.File]::WriteAllText("$PWD/notes.md", $notes)
          Get-Content notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --verify-tag --title "YT Download Manager $env:VERSION" --notes-file notes.md `
            dist/YTDownloadManager-Setup-x64.exe dist/YTDownloadManager-Setup-x86.exe `
            dist/YTStandaloneDownloader-Extension.zip dist/yt-standalone-downloader.user.js dist/SHA256SUMS.txt

      - name: Package manifests
        shell: pwsh
        run: ./.github/packages.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages

  # Installs the release through Scoop and removes it again, without any token (Scoop's own installer
  # script comes from the internet).
  scoop-test:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Install and uninstall through Scoop
        shell: pwsh
        run: ./.github/scoop-test.ps1 -Manifest packages/scoop/yt-download-manager.json

  packages:
    needs: scoop-test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Update the Scoop bucket
        shell: pwsh
        run: |
          $v = (Get-Content packages/scoop/yt-download-manager.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force bucket | Out-Null
          Copy-Item packages/scoop/yt-download-manager.json bucket/yt-download-manager.json
          git add bucket/yt-download-manager.json
          git diff --cached --quiet
          if (-not $LASTEXITCODE) { 'The bucket already has this version'; exit 0 }
          git -c user.name=NyxiYT -c user.email=225954479+NyxiYT@users.noreply.github.com commit -m "chore: Scoop manifest $v"
          git push origin main
          if ($LASTEXITCODE) { throw 'push failed' }

      # WINGET_TOKEN: a GitHub token with the public_repo scope, for the pull request to microsoft/winget-pkgs.
      # Without it the manifests stay in the build's "packages" artifact.
      - name: Check for the winget token
        id: winget
        shell: pwsh
        env:
          T: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ($env:T) { 'ok=1' | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT }
          else { 'No WINGET_TOKEN secret, so no winget pull request' }
      - name: Submit to winget
        if: steps.winget.outputs.ok == '1'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $v = (Get-Content packages/scoop/yt-download-manager.json -Raw | ConvertFrom-Json).version
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe -UseBasicParsing
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: NyxiYT.YTDownloadManager version $v" "packages/winget/$v"
          if ($LASTEXITCODE) { throw "wingetcreate failed ($LASTEXITCODE)" }
