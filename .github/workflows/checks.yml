name: Checks

# Every push and pull request: the JavaScript lint, the generated extension files, the app's build
# (with the code style rules) and its tests. Releases run their own, fuller workflow. Started by hand too:
# components.yml does that for its pull requests, which GitHub doesn't check on its own (they are opened
# with the workflow's token).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Lint the JavaScript
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          npm run lint
          if ($LASTEXITCODE) { throw 'lint failed' }

      - name: Test the extension's service worker
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE) { throw 'extension tests failed' }

      - name: Generated extension files are up to date
        shell: pwsh
        run: |
          python extension-build/convert.py
          git diff --exit-code -- extension/content
          if ($LASTEXITCODE) { throw 'extension/content is out of date: run python extension-build/convert.py' }

      - name: Build the app
        shell: pwsh
        run: |
          dotnet build manager/YTDownloadManager/YTDownloadManager.csproj -c Release -nologo -p:EnforceCodeStyleInBuild=true -warnaserror
          if ($LASTEXITCODE) { throw 'build failed' }

      - name: Test the app
        shell: pwsh
        run: |
          dotnet test manager/Tests/YTDownloadManager.Tests.csproj -c Release -nologo
          if ($LASTEXITCODE) { throw 'tests failed' }
